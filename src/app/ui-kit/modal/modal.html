<dialog
	#dialog
	class="modal"
	[attr.aria-labelledby]="title() ? titleId : null"
	(pointerdown)="onBackdropClick($event)"
	(close)="onNativeClose()"
>
	@if (title()) {
		<header class="modal__header">
			<h2 class="modal__title" [id]="titleId">{{ title() }}</h2>
			<button
				app-button
				aria-label="Закрыть"
				size="small"
				type="button"
				variant="neutral"
				(click)="close()"
			>
				<span app-icon="close"></span>
			</button>
		</header>
	}

	<div class="modal__body">
		<ng-content />
	</div>
</dialog>
