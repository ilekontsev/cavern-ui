<app-page [title]="channel()?.name ?? 'Канал'" subtitle="Страница канала.">
	@if (loading()) {
		<app-card>
			<p class="channel-detail__muted">Загрузка…</p>
		</app-card>
	} @else if (channel(); as channel) {
		<app-card>
			<p class="channel-detail__description">
				{{ channel.description || 'Описание не задано.' }}
			</p>

			<dl class="channel-detail__meta">
				<div class="channel-detail__meta-row">
					<dt class="channel-detail__term">Владелец</dt>
					<dd class="channel-detail__value">{{ channel.ownerLogin }}</dd>
				</div>
				<div class="channel-detail__meta-row">
					<dt class="channel-detail__term">Участников</dt>
					<dd class="channel-detail__value">{{ channel.membersCount }}</dd>
				</div>
			</dl>

			@if (error()) {
				<p class="channel-detail__error">{{ error() }}</p>
			}

			@if (channel.isOwner) {
				<button
					app-button
					class="channel-detail__delete"
					variant="neutral"
					size="small"
					type="button"
					[loading]="deleting()"
					(click)="deleteChannel()"
				>
					Удалить канал
				</button>
			}
		</app-card>
	} @else {
		<app-card heading="Канал не найден">
			<p class="channel-detail__muted">{{ error() }}</p>
			<a app-button variant="secondary" size="small" [routerLink]="routeUrls.channels">
				К каналам
			</a>
		</app-card>
	}
</app-page>
