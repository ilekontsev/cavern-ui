<div class="channels">
	<aside class="channels__sidebar">
		<div class="channels__sidebar-header">
			<p class="channels__title">Каналы</p>

			<div class="channels__actions">
				<a
					app-button
					class="channels__action"
					variant="secondary"
					size="small"
					[routerLink]="routeUrls.channelsNew"
					routerLinkActive="channels__action--active"
				>
					<span app-icon="add"></span>
					Добавить
				</a>

				<a
					app-button
					class="channels__action"
					variant="secondary"
					size="small"
					[routerLink]="routeUrls.channelsSearch"
					routerLinkActive="channels__action--active"
				>
					<span app-icon="search"></span>
					Поиск
				</a>
			</div>
		</div>

		<nav class="channels__nav">
			@if (loading()) {
				<p class="channels__empty">Загрузка…</p>
			} @else if (myChannels().length) {
				@for (channel of myChannels(); track channel.id) {
					<a
						class="channels__link"
						[routerLink]="[routeUrls.channels, channel.id]"
						routerLinkActive="channels__link--active"
					>
						<span class="channels__hash">#</span>
						<span class="channels__link-name">{{ channel.name }}</span>
						@if (channel.isOwner) {
							<span class="channels__owner">владелец</span>
						}
					</a>
				}
			} @else {
				<p class="channels__empty">Пока нет каналов.</p>
			}
		</nav>

		@if (error()) {
			<p class="channels__error">{{ error() }}</p>
		}
	</aside>

	<section class="channels__content">
		<router-outlet />
	</section>
</div>
