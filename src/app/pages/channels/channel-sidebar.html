<aside class="channel-sidebar">
	<div class="channel-sidebar__header">
		<p class="channel-sidebar__title">Каналы</p>

		<button
			class="channel-sidebar__toggle"
			type="button"
			[attr.aria-expanded]="expanded()"
			[attr.aria-label]="expanded() ? 'Свернуть меню каналов' : 'Развернуть меню каналов'"
			[attr.data-tooltip]="expanded() ? null : 'Развернуть'"
			(click)="toggle()"
		>
			<span [app-icon]="expanded() ? 'chevron_left' : 'chevron_right'"></span>
		</button>
	</div>

	<nav class="channel-sidebar__actions" aria-label="Действия с каналами">
		<a
			class="channel-sidebar__action channel-sidebar__row"
			[routerLink]="routeUrls.channelsNew"
			routerLinkActive="channel-sidebar__action--active"
			aria-label="Добавить канал"
			data-tooltip="Добавить"
		>
			<span app-icon="add"></span>
			<span class="channel-sidebar__action-label">Добавить</span>
		</a>

		<a
			class="channel-sidebar__action channel-sidebar__row"
			[routerLink]="routeUrls.channelsSearch"
			routerLinkActive="channel-sidebar__action--active"
			aria-label="Найти канал"
			data-tooltip="Поиск"
		>
			<span app-icon="search"></span>
			<span class="channel-sidebar__action-label">Поиск</span>
		</a>
	</nav>

	<nav class="channel-sidebar__nav" aria-label="Мои каналы">
		@if (loading()) {
			<p class="channel-sidebar__status channel-sidebar__row">
				<span class="channel-sidebar__status-loader" app-loader></span>
				<span class="channel-sidebar__status-label">Загрузка…</span>
			</p>
		} @else if (channels().length) {
			@for (channel of channels(); track channel.id) {
				<a
					class="channel-sidebar__link channel-sidebar__row"
					[routerLink]="[routeUrls.channels, channel.id]"
					routerLinkActive="channel-sidebar__link--active"
					[attr.aria-label]="channel.name"
					[attr.data-tooltip]="channel.name"
				>
					<span class="channel-sidebar__avatar" aria-hidden="true">
						{{ initials(channel.name) }}
					</span>
					<span class="channel-sidebar__link-label">
						<span class="channel-sidebar__name">{{ channel.name }}</span>
						@if (channel.isOwner) {
							<span class="channel-sidebar__owner">владелец</span>
						}
					</span>
				</a>
			}
		} @else {
			<p
				class="channel-sidebar__status channel-sidebar__row"
				[attr.data-tooltip]="expanded() ? null : 'Пока нет каналов'"
			>
				<span class="channel-sidebar__status-icon" app-icon="forum"></span>
				<span class="channel-sidebar__status-label">Пока нет каналов.</span>
			</p>
		}
	</nav>

	@if (error(); as error) {
		<p
			class="channel-sidebar__status channel-sidebar__row channel-sidebar__status--error"
			[attr.data-tooltip]="expanded() ? null : error"
		>
			<span class="channel-sidebar__status-icon" app-icon="error"></span>
			<span class="channel-sidebar__status-label">{{ error }}</span>
		</p>
	}
</aside>
