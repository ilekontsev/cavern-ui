<app-page title="Вход" subtitle="Авторизуйтесь, чтобы открыть профиль.">
	<div class="auth">
		<form class="auth__form" [formRoot]="loginForm">
			<app-input
				inputId="login-name"
				label="Логин"
				type="text"
				autocomplete="username"
				[formField]="loginForm.login"
			/>

			<app-input
				inputId="login-password"
				label="Пароль"
				type="password"
				autocomplete="current-password"
				[formField]="loginForm.password"
			/>

			@for (error of loginForm().errors(); track error) {
				<p class="auth__error">{{ error.message }}</p>
			}

			<button
				app-button
				class="auth__submit"
				variant="primary"
				size="medium"
				type="submit"
				[loading]="loginForm().submitting()"
			>
				Войти
			</button>
		</form>

		<p class="auth__footer">
			Нет аккаунта? <a class="auth__link" [routerLink]="routeUrls.register">Зарегистрироваться</a>
		</p>
	</div>
</app-page>
