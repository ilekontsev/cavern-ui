<app-page title="Регистрация" subtitle="Создайте аккаунт Cavern.">
	<div class="auth">
		<form class="auth__form" [formRoot]="registerForm">
			<app-input
				inputId="register-login"
				label="Логин"
				type="text"
				autocomplete="username"
				[formField]="registerForm.login"
			/>

			<app-input
				inputId="register-password"
				label="Пароль"
				type="password"
				autocomplete="new-password"
				[formField]="registerForm.password"
			/>

			<app-input
				inputId="register-password-confirm"
				label="Повторите пароль"
				type="password"
				autocomplete="new-password"
				[formField]="registerForm.confirmPassword"
			/>

			@for (error of registerForm().errors(); track error) {
				<p class="auth__error">{{ error.message }}</p>
			}

			<p class="auth__hint">
				Роль, тип пользователя и дата регистрации будут назначены автоматически.
			</p>

			<button
				app-button
				class="auth__submit"
				variant="primary"
				size="medium"
				type="submit"
				[loading]="registerForm().submitting()"
			>
				Зарегистрироваться
			</button>
		</form>

		<p class="auth__footer">
			Уже есть аккаунт? <a class="auth__link" routerLink="/login">Войти</a>
		</p>
	</div>
</app-page>
