<div class="shell">
	<header class="shell__header">
		<a class="shell__brand" routerLink="/">Cavern</a>

		<nav class="shell__nav">
			<a
				class="shell__link"
				routerLink="/"
				routerLinkActive="shell__link--active"
				[routerLinkActiveOptions]="{ exact: true }"
			>
				Старт
			</a>
			<a class="shell__link" routerLink="/profile" routerLinkActive="shell__link--active">
				Профиль
			</a>
			<a class="shell__link" routerLink="/test" routerLinkActive="shell__link--active">Тест</a>

			@if (currentUser(); as user) {
				<span class="shell__user">{{ user.login }}</span>
				<button class="shell__logout" type="button" (click)="logout()">Выйти</button>
			} @else {
				<a class="shell__link" routerLink="/login" routerLinkActive="shell__link--active"> Вход </a>
				<a class="shell__link" routerLink="/register" routerLinkActive="shell__link--active">
					Регистрация
				</a>
			}
		</nav>

		<button
			class="shell__theme"
			type="button"
			[attr.aria-label]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
			[attr.title]="theme() === 'dark' ? 'Светлая тема' : 'Тёмная тема'"
			(click)="toggleTheme()"
		>
			{{ theme() === 'dark' ? '☀' : '☾' }}
		</button>
	</header>

	<main class="shell__main">
		<router-outlet />
	</main>
</div>
