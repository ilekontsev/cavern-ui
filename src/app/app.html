<div class="shell">
	<header class="shell__header">
		<a class="shell__brand" [routerLink]="routeUrls.home">Cavern</a>

		<nav class="shell__nav">
			<a
				class="shell__link"
				[routerLink]="routeUrls.home"
				routerLinkActive="shell__link--active"
				[routerLinkActiveOptions]="{ exact: true }"
			>
				Старт
			</a>
			<a
				class="shell__link"
				[routerLink]="routeUrls.channels"
				routerLinkActive="shell__link--active"
			>
				Каналы
			</a>
			<a class="shell__link" [routerLink]="routeUrls.docs" routerLinkActive="shell__link--active">
				Docs
			</a>
			<a
				class="shell__link"
				[routerLink]="routeUrls.profile"
				routerLinkActive="shell__link--active"
			>
				Профиль
			</a>
			<a
				class="shell__link"
				[routerLink]="routeUrls.sandbox"
				routerLinkActive="shell__link--active"
			>
				Песочница
			</a>

			@if (currentUser(); as user) {
				<span class="shell__user">{{ user.login }}</span>
				<button app-button variant="neutral" size="small" type="button" (click)="logout()">
					Выйти
				</button>
			} @else {
				<a
					class="shell__link"
					[routerLink]="routeUrls.login"
					routerLinkActive="shell__link--active"
				>
					Вход
				</a>
				<a
					class="shell__link"
					[routerLink]="routeUrls.register"
					routerLinkActive="shell__link--active"
				>
					Регистрация
				</a>
			}
		</nav>

		<button
			app-button
			variant="secondary"
			size="small"
			type="button"
			[attr.aria-label]="theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
			[attr.title]="theme() === 'dark' ? 'Светлая тема' : 'Тёмная тема'"
			(click)="toggleTheme()"
		>
			{{ theme() === 'dark' ? '☀' : '☾' }}
		</button>
	</header>

	<main class="shell__main">
		<router-outlet />
	</main>
</div>
